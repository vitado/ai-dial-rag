name: SCA fix

# Soak: runs after a scheduled "SCA Scan" (real runs, PRs on the fork) and on manual dispatch. Remove in P6 together with the w4test-* branches.

on:
  workflow_run:
    workflows: ["SCA Scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      report-run-ids:
        description: Comma-separated ids of runs whose sca-report artifact feeds the planner
        required: true
      config:
        description: Planner configuration (JSON)
        default: "{}"
      dry-run:
        description: Plan, apply and rescan only, no push and no pull request
        type: boolean
        default: false

concurrency:
  group: sca-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')
    permissions:
      contents: read
      actions: read
      statuses: read
      packages: read
    uses: vitado/ai-dial-ci/.github/workflows/sca_fix.yml@feat/sca-fix
    with:
      report-run-ids: ${{ inputs.report-run-ids || github.event.workflow_run.id }}
      config: ${{ inputs.config || '{}' }}
      dry-run: ${{ inputs.dry-run || false }}
      app-client-id: ${{ vars.SCA_FIX_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.SCA_FIX_APP_PRIVATE_KEY }}


