name: SCA Scan

# Soak: daily scheduled scan on the engine rc (sca-canary) plus manual runs; the fixer is chained after the scheduled run.

on:
  schedule:
    - cron: "3 5 * * *"
  workflow_dispatch:
    inputs:
      scan-tag:
        description: "Focus the run on this one git tag (its source and the tag in every image) instead of the release set; empty = the full set"
        type: string
        default: ""
      force-image-scan:
        description: "On this one run, run the direct OSV image scan also where it is off for this repository"
        type: boolean
        default: false

run-name: >-
  SCA - ${{ github.event_name == 'schedule' && 'scheduled' || format('manual by {0}', github.triggering_actor) }}${{ inputs.scan-tag && format(' - tag {0}', inputs.scan-tag) || '' }}

concurrency:
  group: sca-scan
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@sca-canary
    with:
      repository: epam/ai-dial-rag
      images: |
        epam/ai-dial-rag
      osv-image-scan: false
      scan-tag: ${{ inputs.scan-tag }}
      force-image-scan: ${{ inputs.force-image-scan || false }}
